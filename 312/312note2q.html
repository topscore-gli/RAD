<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Mains Circuit</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
    :root{--bg:#1e1e2f;--si:#171723;--so:#25253b;--t:#fff;--a:#1db954;--d:#ff4d4d;--w:#ff9800;--info:#2196f3}
    body.light{--bg:#e0e5ec;--si:#a3b1c6;--so:#ffffff;--t:#2d3748;--a:#48bb78;--d:#e53e3e;--w:#dd6b20;--info:#1976d2}
    body{background:var(--bg);color:var(--t);min-height:100vh;line-height:1.6}
    
    #load{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
    #load.hide{opacity:0;pointer-events:none;display:none}
    .spinner{width:40px;height:40px;border:3px solid var(--si);border-top-color:var(--a);border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    
    #quiz{display:none;max-width:800px;margin:0 auto;padding:80px 12px 100px}
    
    .top{position:fixed;top:0;left:0;right:0;height:56px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.1)}
    .top h1{font-size:15px;font-weight:600;flex:1;text-align:center}
    .btn{width:36px;height:36px;border-radius:50%;background:var(--bg);border:none;color:var(--t);cursor:pointer;box-shadow:3px 3px 6px var(--si),-3px -3px 6px var(--so);display:flex;align-items:center;justify-content:center;font-size:16px}
    .btn:active{box-shadow:inset 2px 2px 4px var(--si),inset -2px -2px 4px var(--so)}
    
    .prog{position:fixed;top:56px;left:0;right:0;height:3px;background:var(--si);z-index:99}
    .prog-bar{height:100%;background:var(--a);width:0%;transition:width .2s}
    .prog-text{position:fixed;top:62px;right:12px;font-size:11px;background:var(--bg);padding:2px 8px;border-radius:10px;box-shadow:1px 1px 2px var(--si)}
    
    .q-cont{background:var(--bg);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:4px 4px 8px var(--si),-4px -4px 8px var(--so)}
    .timer{font-size:13px;margin-bottom:12px;color:#888;display:flex;align-items:center;gap:6px}
    .timer.warn{color:var(--w);font-weight:600}
    .timer.danger{color:var(--d);font-weight:600;animation:pulse 1s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .section-type{display:inline-block;padding:4px 12px;background:var(--a);color:#fff;font-size:11px;border-radius:20px;margin-bottom:10px;font-weight:600}
    .question{font-size:15px;font-weight:600;margin-bottom:14px;padding:12px;background:rgba(0,0,0,.03);border-radius:8px;line-height:1.6}
    
    .opts{display:flex;flex-direction:column;gap:10px}
    .opt{padding:14px 16px;background:var(--bg);border-radius:10px;cursor:pointer;box-shadow:3px 3px 6px var(--si),-3px -3px 6px var(--so);display:flex;align-items:center;gap:12px;transition:all .15s;border:2px solid transparent}
    .opt:hover{border-color:rgba(29,185,84,.3)}
    .opt.sel{border-color:var(--a);background:rgba(29,185,84,.05);box-shadow:inset 2px 2px 4px var(--si),inset -2px -2px 4px var(--so)}
    .opt-mark{width:26px;height:26px;border-radius:50%;background:var(--si);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
    .opt.sel .opt-mark{background:var(--a);color:#fff}
    .opt p{font-size:14px;flex:1}
    
    .nav{position:fixed;bottom:0;left:0;right:0;height:70px;background:var(--bg);display:flex;align-items:center;justify-content:center;gap:12px;padding:0 12px;box-shadow:0 -2px 8px rgba(0,0,0,.1);z-index:100}
    .nav-btn{padding:12px 24px;border-radius:8px;border:none;background:var(--bg);color:var(--t);font-size:14px;font-weight:600;cursor:pointer;box-shadow:3px 3px 6px var(--si),-3px -3px 6px var(--so)}
    .nav-btn:disabled{opacity:.4;cursor:not-allowed}
    .nav-btn.primary{background:var(--a);color:#fff}
    .nav-center{width:48px;height:48px;border-radius:50%;background:var(--a);color:#fff;border:none;font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(29,185,84,.3)}
    
    .pop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:20px}
    .pop.show{display:flex}
    .pop-box{background:var(--bg);border-radius:16px;padding:20px;width:100%;max-width:360px;max-height:80vh;overflow-y:auto}
    .pop-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .pop h3{font-size:16px}
    .pop-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
    .pop-grid button{aspect-ratio:1;border:none;border-radius:8px;background:var(--bg);color:var(--t);font-size:12px;font-weight:600;cursor:pointer;box-shadow:2px 2px 4px var(--si),-2px -2px 4px var(--so)}
    .pop-grid button.ans{background:var(--a);color:#fff}
    .pop-grid button.cur{border:2px solid var(--a)}
    
    .res{display:none;position:fixed;inset:0;background:var(--bg);z-index:300;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow-y:auto}
    .res.show{display:flex}
    .res-box{background:var(--bg);padding:32px;border-radius:24px;box-shadow:8px 8px 16px var(--si),-8px -8px 12px var(--so);max-width:400px;width:100%}
    .res-circle{width:140px;height:140px;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 24px;box-shadow:6px 6px 12px var(--si),-6px -6px 12px var(--so)}
    .res-score{font-size:36px;font-weight:800;color:var(--a)}
    .res-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#888;margin-top:4px}
    .res h2{font-size:24px;margin-bottom:8px}
    .res p{color:#888;margin-bottom:24px;font-size:15px;line-height:1.5}
    .res-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
    .res-btns button{min-width:120px}
    
    .det{display:none;position:fixed;inset:0;background:var(--bg);z-index:250;overflow-y:auto;padding:80px 16px 24px}
    .det-head{position:fixed;top:0;left:0;right:0;height:56px;background:var(--bg);display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 2px 8px rgba(0,0,0,.1);z-index:251}
    .det h3{flex:1;font-size:16px}
    .det-summary{background:var(--bg);padding:20px;border-radius:16px;margin-bottom:20px;box-shadow:4px 4px 8px var(--si),-4px -4px 8px var(--so);text-align:center}
    .det-summary .big{font-size:48px;font-weight:800;color:var(--a)}
    .det-item{margin-bottom:16px;padding:16px;background:rgba(0,0,0,.03);border-radius:12px;border-left:4px solid var(--d)}
    .det-item.ok{border-left-color:var(--a)}
    .det-item h4{font-size:13px;color:#888;margin-bottom:8px}
    .det-item .q-text{font-size:15px;font-weight:600;margin-bottom:10px;padding:10px;background:var(--bg);border-radius:8px}
    .det-item .ans-row{display:flex;gap:16px;margin-bottom:6px;font-size:14px}
    .det-item .ans-row strong{min-width:80px}
    .det-item .exp{font-size:13px;color:#666;margin-top:10px;padding:12px;background:var(--bg);border-radius:8px;box-shadow:inset 2px 2px 4px var(--si);line-height:1.6}
    
    .hide{display:none!important}
    @media(max-width:400px){
      .opt{padding:12px}
      .res-box{padding:24px}
      .res-circle{width:120px;height:120px}
      .res-score{font-size:32px}
      .pop-grid{grid-template-columns:repeat(5,1fr)}
    }
  </style>
</head>
<body>
  <div id="load"><div class="spinner"></div></div>

  <div id="quiz">
    <div class="top">
      <button class="btn" onclick="exit()">←</button>
      <h1>The Mains Circuit</h1>
      <button class="btn" onclick="toggleTheme()">🌙</button>
    </div>
    
    <div class="prog"><div class="prog-bar" id="pbar"></div></div>
    <div class="prog-text" id="ptxt">0/0</div>
    
    <div class="q-cont">
      <div class="timer" id="timer">⏱️ 20:00</div>
      <div class="section-type" id="stype">Section A</div>
      <div class="question" id="question"></div>
      <div class="opts" id="opts"></div>
    </div>
    
    <div class="nav">
      <button class="nav-btn" id="prevBtn" onclick="prev()">← Prev</button>
      <button class="nav-center" onclick="showPop()">📋</button>
      <button class="nav-btn primary" id="nextBtn" onclick="next()">Next →</button>
    </div>
  </div>

  <div class="pop" id="pop" onclick="hidePop(event)">
    <div class="pop-box" onclick="event.stopPropagation()">
      <div class="pop-head">
        <h3>Question Navigator</h3>
        <button class="btn" onclick="hidePop()">✕</button>
      </div>
      <div class="pop-grid" id="pgrid"></div>
      <div style="font-size:12px;color:#888;text-align:center;margin-top:8px">
        <span style="color:var(--a)">●</span> Answered &nbsp;
        <span style="color:var(--t)">●</span> Current &nbsp;
        <span style="color:#666">●</span> Unanswered
      </div>
    </div>
  </div>

  <div class="res" id="res">
    <div class="res-box">
      <div class="res-circle">
        <div class="res-score" id="rscore">0%</div>
        <div class="res-label">Score</div>
      </div>
      <h2 id="rtitle">Quiz Complete!</h2>
      <p id="rmsg">You completed the quiz</p>
      <div class="res-btns">
        <button class="primary" onclick="showDet()">📊 View Details</button>
        <button class="nav-btn" onclick="continueQuiz()">↩ Continue</button>
        <button class="nav-btn" onclick="restart()" style="background:var(--d);color:#fff">🔄 Restart</button>
      </div>
    </div>
  </div>

  <div class="det" id="det">
    <div class="det-head">
      <button class="btn" onclick="hideDet()">← Back</button>
      <h3>Detailed Results</h3>
      <button class="btn" onclick="window.print()">🖨️ Print</button>
    </div>
    <div id="dcont"></div>
  </div>

<script>
const CONFIG = { TIME: 1200, PASS: 60 };

const SECTIONS = {
  0: "A: Mains Circuit Basics & Supply",
  10: "B: Types of Switches",
  25: "C: Circuit Breakers",
  32: "D: Magnetic Contactors",
  40: "E: Remote Switches & Line Voltage Compensators"
};

function getSection(qIndex) {
  var keys = Object.keys(SECTIONS).map(Number).sort(function(a, b) { return b - a; });
  for (var i = 0; i < keys.length; i++) {
    if (qIndex >= keys[i]) return SECTIONS[keys[i]];
  }
  return "Introduction";
}

const QUIZ_DATA = [
  {q:"The mains X-ray circuit is separate from the:",o:["Anode circuit","Filament circuit","Rotor circuit","Exposure circuit"],a:1,e:"The mains circuit is distinct from the filament circuit."},
  {q:"The main function of the mains X-ray circuit is to create a potential difference between the:",o:["Anode and rotor","Filament and stator","Cathode and anode","Cathode and filament"],a:2,e:"It establishes the high potential difference between cathode and anode (kVp)."},
  {q:"The potential difference should remain ______ throughout X-ray production.",o:["Increasing","Decreasing","Constant","Zero"],a:2,e:"A constant potential difference is required for consistent X-ray production."},
  {q:"Maintaining a constant potential difference helps produce a:",o:["Larger focal spot","Uniform X-ray beam","Lower tube current","Stronger filament"],a:1,e:"Constant kV produces a more uniform X-ray beam."},
  {q:"The components of the mains circuit are discussed starting from the:",o:["X-ray tube","Filament","Mains supply","Anode"],a:2,e:"The discussion begins at the mains supply."},
  {q:"A wall socket can supply approximately:",o:["110 V","120 V","240 V","415 V"],a:2,e:"A standard wall socket supplies about 240 V."},
  {q:"The material associates a 240 V supply particularly with:",o:["High-powered stationary units","Mobile and portable units","CT scanners only","MRI systems"],a:1,e:"Mobile and portable units commonly use a 240 V supply."},
  {q:"High-powered X-ray units are described as using a supply of approximately:",o:["110 V","220 V","240 V","415 V"],a:3,e:"High-powered stationary units typically use a 415 V supply."},
  {q:"The 415 V supply mentioned in the material is obtained by combining:",o:["Two line voltages of 240 V","Three line voltages of 110 V","Two line voltages of 110 V","Three line voltages of 240 V"],a:0,e:"415 V is obtained by combining two 240 V line voltages (phase-to-phase)."},
  {q:"Which component controls the electrical supply entering the X-ray system?",o:["Mains switch","Filament","Anode","Rotor"],a:0,e:"The mains switch controls the entry of electrical power into the system."},

  {q:"How many possible types of switches are identified in the material?",o:["Four","Five","Six","Seven"],a:2,e:"Six types of switches are identified."},
  {q:"A toggle switch is operated by:",o:["Rotating a motor","Flipping a lever","Pressing a computer key","Using a magnetic field only"],a:1,e:"A toggle switch is operated by flipping a lever."},
  {q:"A toggle switch can be used to:",o:["Increase filament temperature","Complete or break a circuit","Produce X-rays directly","Stabilize voltage"],a:1,e:"It simply completes or breaks the circuit."},
  {q:"Toggle switches may commonly be found in:",o:["Smaller or older X-ray systems","Only modern automated systems","MRI machines","Ultrasound machines"],a:0,e:"They are common in smaller or older equipment."},
  {q:"One limitation of a toggle switch is that it is mainly:",o:["Automatic","Remote-controlled","Manual","Magnetic"],a:2,e:"Toggle switches are primarily manual devices."},
  {q:"Toggle switches are less suited to systems requiring:",o:["Manual operation","Simple switching","Remote control and advanced safety features","Electrical power"],a:2,e:"They are not ideal when remote control or advanced safety interlocks are needed."},
  {q:"A push-button switch is activated by:",o:["Pulling a lever","Pressing a button","Turning a wheel","Moving a blade"],a:1,e:"It is activated by pressing a button."},
  {q:"A momentary push-button switch completes the circuit:",o:["Permanently","Only while the button is pressed","Only when released","Until the mains supply fails"],a:1,e:"A momentary switch is only closed while the button is held down."},
  {q:"A latching push-button switch:",o:["Operates only while being pressed","Remains in its ON or OFF position until pressed again","Cannot open a circuit","Automatically compensates voltage"],a:1,e:"A latching switch stays in the new position until pressed again."},
  {q:"Push-button switches are often used for:",o:["Emergency shut-offs","Voltage transformation","Producing electrons","Cooling the X-ray tube"],a:0,e:"They are commonly used for emergency stop / shut-off functions."},
  {q:"Push-button switches are particularly suitable when:",o:["Rapid one-touch operation is required","Continuous manual control is required","Voltage compensation is required","High-voltage transformation is required"],a:0,e:"They allow rapid, one-touch operation."},
  {q:"A knife switch uses a ______ to connect or disconnect the circuit.",o:["Magnetic coil","Computer interface","Lever or blade","Push button"],a:2,e:"A knife switch uses a lever or blade."},
  {q:"Knife switches are designed to handle:",o:["Very low currents only","High currents","No current","Filament current only"],a:1,e:"They are designed for high-current applications."},
  {q:"Knife switches are typically associated with:",o:["Heavy-duty systems and older X-ray machines","Wireless systems only","Portable phones","Modern computer systems only"],a:0,e:"They are found in heavy-duty and older X-ray installations."},
  {q:"Which switch is described as a large manual switch?",o:["Toggle switch","Push-button switch","Knife switch","Remote-controlled switch"],a:2,e:"The knife switch is described as a large manual switch."},

  {q:"A circuit breaker switch serves a dual function as a:",o:["Transformer and resistor","Switch and protective device","Filament and cathode","Generator and motor"],a:1,e:"It acts both as a switch and as a protective device."},
  {q:"A circuit breaker automatically opens the circuit when it detects:",o:["Normal operation","An overload or short circuit","Low room temperature","High humidity only"],a:1,e:"It trips on overload or short-circuit conditions."},
  {q:"The main purpose of the protective function of a circuit breaker is to:",o:["Increase X-ray production","Prevent damage to the machine and ensure safety","Increase filament temperature","Produce a larger focal spot"],a:1,e:"It protects the equipment and improves safety."},
  {q:"After tripping, a circuit breaker can generally be:",o:["Destroyed","Manually reset","Converted into a fuse","Used as a transformer"],a:1,e:"Most circuit breakers can be manually reset after tripping."},
  {q:"Circuit breakers are commonly used in:",o:["Modern X-ray machines","Only very old X-ray machines","Microscopes","Ultrasound probes"],a:0,e:"They are standard in modern X-ray equipment."},
  {q:"Compared with simpler switches, circuit breakers can be:",o:["Smaller and cheaper","Bulkier and more expensive","Completely manual","Unable to interrupt current"],a:1,e:"They tend to be bulkier and more expensive than simple switches."},
  {q:"The protective functionality of circuit breakers makes them particularly important in:",o:["High-voltage applications","Low-temperature applications","Filament manufacturing","Image processing only"],a:0,e:"Their protective role is especially valuable in high-voltage circuits."},

  {q:"A magnetic contactor is an:",o:["Electrically operated switch","Mechanical fuse","X-ray tube","Voltage transformer"],a:0,e:"It is an electrically operated switch that uses a magnetic field."},
  {q:"A magnetic contactor uses a ______ to connect or disconnect the power circuit.",o:["Hydraulic pressure","Magnetic field","Filament","Water pressure"],a:1,e:"A magnetic field generated by a coil operates the contacts."},
  {q:"Magnetic contactors are widely used in:",o:["Industrial and medical applications","Only domestic lighting","Only portable radios","Film processing chemicals"],a:0,e:"They are common in both industrial and medical equipment."},
  {q:"Magnetic contactors are especially useful where ______ control is required.",o:["Manual-only","Remote or automatic","Hydraulic","Optical"],a:1,e:"They excel when remote or automatic control is needed."},
  {q:"Magnetic contactors can handle:",o:["High voltages and currents","Only low voltages","Only filament currents","No electrical current"],a:0,e:"They are capable of switching high voltages and currents."},
  {q:"One advantage of magnetic contactors is that they support:",o:["Automation and remote control","Film development","Voltage measurement only","Manual blade operation"],a:0,e:"They readily support automation and remote control."},
  {q:"Compared with manual switches such as toggles, magnetic contactors are generally:",o:["Less complex and cheaper","More complex and costly","Completely mechanical","Unable to control high power"],a:1,e:"They are more complex and therefore more costly."},
  {q:"Magnetic contactors are particularly suitable for:",o:["Large systems","Only small battery-powered devices","Emergency lighting only","Non-electrical equipment"],a:0,e:"They are well suited to large, high-power systems."},

  {q:"A remote-controlled switch allows an operator to control a switch:",o:["Only by physically touching it","From a distance","Only after removing the X-ray tube","Without electricity"],a:1,e:"It can be operated from a remote location."},
  {q:"Which of the following may be used to operate a remote-controlled switch?",o:["Wireless system","Control panel","Computer interface","All of the above"],a:3,e:"Wireless systems, control panels and computer interfaces can all be used."},
  {q:"Remote-controlled switches are used in advanced medical devices where ______ are necessary.",o:["Automation and remote operation","Manual blades","Mechanical pressure","Filament heating"],a:0,e:"They support the automation and remote operation required in advanced systems."},
  {q:"One advantage of a remote-controlled switch is:",o:["Greater flexibility in controlling power","Elimination of electricity","Lower complexity in every case","Elimination of installation requirements"],a:0,e:"It gives greater flexibility in how and where power is controlled."},
  {q:"A major disadvantage of remote-controlled switches is that they:",o:["Cannot control power","Are more expensive and require specialized installation","Cannot be used in medical equipment","Only work manually"],a:1,e:"They are more expensive and need specialized installation."},

  {q:"Line voltage compensators are located between the:",o:["Cathode and anode","Mains supply and mains circuit","Filament and cathode","Anode and rotor"],a:1,e:"They sit between the mains supply and the rest of the mains circuit."},
  {q:"The primary function of a line voltage compensator is to:",o:["Produce electrons","Stabilize voltage fluctuations","Increase filament temperature","Rotate the anode"],a:1,e:"It stabilises fluctuations in the mains supply voltage."},
  {q:"Voltage fluctuations can occur in the:",o:["Mains supply","X-ray film only","Patient's body","Collimator only"],a:0,e:"Fluctuations originate in the mains supply."},
  {q:"Why is voltage stabilization important in an X-ray system according to the material?",o:["The potential difference should remain constant during X-ray production","It makes the machine completely wireless","It eliminates the need for a switch","It prevents the anode from rotating"],a:0,e:"A constant potential difference is essential for consistent X-ray production."},
  {q:"Which sequence best represents the basic progression discussed in the material?",o:["X-ray tube → mains supply → wall socket → patient","Mains supply → mains circuit/switching → voltage stabilization → X-ray tube","Filament → patient → mains switch → wall socket","Anode → cathode → mains supply → circuit breaker"],a:1,e:"The logical flow is mains supply → switching and stabilisation → X-ray tube."}
];

var state = {
  data: QUIZ_DATA,
  ans: new Array(QUIZ_DATA.length).fill(null),
  q: 0,
  time: CONFIG.TIME,
  timer: null,
  submitted: false
};

function init() {
  var loadEl = document.getElementById('load');
  if (loadEl) loadEl.classList.add('hide');

  try {
    var saved = sessionStorage.getItem('mains_circuit_quiz_progress');
    if (saved) {
      var d = JSON.parse(saved);
      if (Date.now() - d.ts < 86400000 && !d.submitted) {
        state.q = d.q;
        state.ans = d.ans;
        state.time = d.time;
      }
    }
  } catch (e) {}

  document.getElementById('quiz').style.display = 'block';
  startTimer();
  render();
}

function startTimer() {
  if (state.timer) clearInterval(state.timer);
  state.timer = setInterval(function() {
    if (state.time > 0) {
      state.time--;
      updateTimer();
      if (state.time % 10 === 0) saveProgress();
    } else {
      submit(true);
    }
  }, 1000);
}

function updateTimer() {
  var m = Math.floor(state.time / 60);
  var s = state.time % 60;
  var el = document.getElementById('timer');
  el.textContent = '⏱️ ' + m + ':' + (s < 10 ? '0' + s : s);
  el.className = 'timer' + (state.time < 60 ? ' danger' : state.time < 300 ? ' warn' : '');
}

function render() {
  var q = state.data[state.q];
  var done = state.ans.filter(function(x) { return x !== null; }).length;

  document.getElementById('pbar').style.width = (done / state.data.length * 100) + '%';
  document.getElementById('ptxt').textContent = done + '/' + state.data.length;
  document.getElementById('stype').textContent = 'Section ' + getSection(state.q) + ' • Question ' + (state.q + 1) + '/50';
  document.getElementById('question').textContent = q.q;

  var opts = document.getElementById('opts');
  opts.innerHTML = '';
  for (var i = 0; i < q.o.length; i++) {
    var d = document.createElement('div');
    d.className = 'opt' + (state.ans[state.q] === i ? ' sel' : '');
    d.innerHTML = '<div class="opt-mark">' + String.fromCharCode(65 + i) + '</div><p>' + q.o[i] + '</p>';
    d.onclick = (function(idx) {
      return function() { select(idx); };
    })(i);
    opts.appendChild(d);
  }

  document.getElementById('prevBtn').disabled = state.q === 0;
  document.getElementById('nextBtn').textContent = state.q === state.data.length - 1 ? 'Submit Quiz ✓' : 'Next →';
}

function select(i) {
  state.ans[state.q] = i;
  var opts = document.querySelectorAll('.opt');
  for (var j = 0; j < opts.length; j++) {
    opts[j].classList.toggle('sel', j === i);
  }
  saveProgress();
}

function next() {
  if (state.q === state.data.length - 1) {
    var unans = state.ans.filter(function(x) { return x === null; }).length;
    if (unans > 0 && !confirm(unans + ' question(s) unanswered. Submit anyway?')) {
      showPop();
      return;
    }
    submit(false);
    return;
  }
  state.q++;
  render();
}

function prev() {
  if (state.q > 0) state.q--;
  render();
}

function saveProgress() {
  try {
    sessionStorage.setItem('mains_circuit_quiz_progress', JSON.stringify({
      q: state.q,
      ans: state.ans,
      time: state.time,
      submitted: state.submitted,
      ts: Date.now()
    }));
  } catch (e) {}
}

function submit(timeout) {
  clearInterval(state.timer);
  state.submitted = true;
  saveProgress();

  var correct = 0;
  for (var i = 0; i < state.data.length; i++) {
    if (state.ans[i] === state.data[i].a) correct++;
  }
  var pct = Math.round((correct / state.data.length) * 100);

  document.getElementById('quiz').style.display = 'none';
  document.getElementById('res').style.display = 'flex';
  document.getElementById('res').classList.add('show');
  document.getElementById('rscore').textContent = pct + '%';

  var title, msg;
  if (timeout) title = '⏰ Time Up!';
  else if (pct >= 80) title = '🎉 Outstanding!';
  else if (pct >= 60) title = '🌟 Well Done!';
  else if (pct >= 40) title = '👍 Good Effort!';
  else title = '💪 Keep Going!';

  if (pct >= 80) {
    msg = 'You scored <strong>' + correct + '/' + state.data.length + '</strong> (' + pct + '%)<br><br>Excellent understanding of The Mains Circuit! You have a strong grasp of switches, circuit breakers, magnetic contactors and voltage compensation. Superb work!';
  } else if (pct >= 60) {
    msg = 'You scored <strong>' + correct + '/' + state.data.length + '</strong> (' + pct + '%)<br><br>✓ Pass mark achieved! Solid knowledge. Review the different switch types and the role of magnetic contactors to strengthen any weak areas.';
  } else if (pct >= 40) {
    msg = 'You scored <strong>' + correct + '/' + state.data.length + '</strong> (' + pct + '%)<br><br>You’re making progress. Focus on the six types of switches, the dual role of circuit breakers, and why voltage stabilisation is important. Practice will raise your score quickly!';
  } else {
    msg = 'You scored <strong>' + correct + '/' + state.data.length + '</strong> (' + pct + '%)<br><br>Don’t worry — this topic covers several important components. Go through the explanations carefully, revise the key points, and try again. You can master it!';
  }

  document.getElementById('rtitle').textContent = title;
  document.getElementById('rmsg').innerHTML = msg;
}

function continueQuiz() {
  document.getElementById('res').classList.remove('show');
  document.getElementById('res').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
}

function showPop() {
  var g = document.getElementById('pgrid');
  g.innerHTML = '';
  for (var i = 0; i < state.data.length; i++) {
    var b = document.createElement('button');
    b.textContent = i + 1;
    if (state.ans[i] !== null) b.className = 'ans';
    if (i === state.q) b.style.border = '2px solid var(--a)';
    b.onclick = (function(idx) {
      return function() {
        state.q = idx;
        hidePop();
        render();
      };
    })(i);
    g.appendChild(b);
  }
  document.getElementById('pop').classList.add('show');
}

function hidePop(e) {
  if (!e || e.target.id === 'pop') {
    document.getElementById('pop').classList.remove('show');
  }
}

function showDet() {
  var c = document.getElementById('dcont');
  c.innerHTML = '';

  var correct = 0;
  for (var i = 0; i < state.data.length; i++) {
    if (state.ans[i] === state.data[i].a) correct++;
  }
  var pct = Math.round((correct / state.data.length) * 100);

  var sum = document.createElement('div');
  sum.className = 'det-summary';
  sum.innerHTML = '<div class="big">' + pct + '%</div><div>' + correct + '/' + state.data.length + ' correct</div>';
  c.appendChild(sum);

  var sections = [0, 10, 25, 32, 40, 50];
  var sectionNames = [
    "A: Mains Circuit Basics & Supply",
    "B: Types of Switches",
    "C: Circuit Breakers",
    "D: Magnetic Contactors",
    "E: Remote Switches & Line Voltage Compensators"
  ];

  for (var s = 0; s < 5; s++) {
    var start = sections[s];
    var end = sections[s + 1];

    var ph = document.createElement('div');
    ph.style.cssText = 'margin:20px 0 12px;padding:12px;background:var(--a);color:#fff;border-radius:8px;font-size:14px';
    ph.innerHTML = '<strong>Section ' + sectionNames[s] + '</strong>';
    c.appendChild(ph);

    for (var i = start; i < end; i++) {
      var q = state.data[i];
      var ans = state.ans[i];
      var ok = ans === q.a;
      var d = document.createElement('div');
      d.className = 'det-item' + (ok ? ' ok' : '');
      d.innerHTML = 
        '<h4>Question ' + (i + 1) + '</h4>' +
        '<div class="q-text">' + q.q + '</div>' +
        '<div class="ans-row"><strong>Your answer:</strong> ' + (ans !== null ? String.fromCharCode(65 + ans) + ') ' + q.o[ans] : 'Not answered') + '</div>' +
        '<div class="ans-row"><strong>Correct:</strong> ' + String.fromCharCode(65 + q.a) + ') ' + q.o[q.a] + '</div>' +
        '<div class="exp">' + q.e + '</div>';
      c.appendChild(d);
    }
  }

  document.getElementById('res').classList.remove('show');
  document.getElementById('res').style.display = 'none';
  document.getElementById('det').style.display = 'block';
}

function hideDet() {
  document.getElementById('det').style.display = 'none';
  document.getElementById('res').style.display = 'flex';
  document.getElementById('res').classList.add('show');
}

function restart() {
  if (!confirm('Start a new quiz? All progress will be reset.')) return;
  sessionStorage.removeItem('mains_circuit_quiz_progress');
  location.reload();
}

function exit() {
  if (confirm('Exit quiz? Your progress is saved.')) {
    saveProgress();
    location.reload();
  }
}

function toggleTheme() {
  document.body.classList.toggle('light');
  localStorage.setItem('mains_circuit_quiz_theme', document.body.classList.contains('light') ? 'light' : 'dark');
}

document.addEventListener('DOMContentLoaded', function() {
  if (localStorage.getItem('mains_circuit_quiz_theme') === 'light') {
    document.body.classList.add('light');
  }
  init();
});
</script>
</body>
</html>
