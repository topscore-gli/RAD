<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exposure Switches & Switching Devices</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
    :root{--bg:#1e1e2f;--si:#171723;--so:#25253b;--t:#fff;--a:#1db954;--d:#ff4d4d;--w:#ff9800;--info:#2196f3}
    body.light{--bg:#e0e5ec;--si:#a3b1c6;--so:#ffffff;--t:#2d3748;--a:#48bb78;--d:#e53e3e;--w:#dd6b20;--info:#1976d2}
    body{background:var(--bg);color:var(--t);min-height:100vh;line-height:1.6}
    
    #load{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
    #load.hide{opacity:0;pointer-events:none;display:none}
    .spinner{width:40px;height:40px;border:3px solid var(--si);border-top-color:var(--a);border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    
    #quiz{display:none;max-width:800px;margin:0 auto;padding:80px 12px 100px}
    
    .top{position:fixed;top:0;left:0;right:0;height:56px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.1)}
    .top h1{font-size:15px;font-weight:600;flex:1;text-align:center}
    .btn{width:36px;height:36px;border-radius:50%;background:var(--bg);border:none;color:var(--t);cursor:pointer;box-shadow:3px 3px 6px var(--si),-3px -3px 6px var(--so);display:flex;align-items:center;justify-content:center;font-size:16px}
    .btn:active{box-shadow:inset 2px 2px 4px var(--si),inset -2px -2px 4px var(--so)}
    
    .prog{position:fixed;top:56px;left:0;right:0;height:3px;background:var(--si);z-index:99}
    .prog-bar{height:100%;background:var(--a);width:0%;transition:width .2s}
    .prog-text{position:fixed;top:62px;right:12px;font-size:11px;background:var(--bg);padding:2px 8px;border-radius:10px;box-shadow:1px 1px 2px var(--si)}
    
    .q-cont{background:var(--bg);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:4px 4px 8px var(--si),-4px -4px 8px var(--so)}
    .timer{font-size:13px;margin-bottom:12px;color:#888;display:flex;align-items:center;gap:6px}
    .timer.warn{color:var(--w);font-weight:600}
    .timer.danger{color:var(--d);font-weight:600;animation:pulse 1s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .section-type{display:inline-block;padding:4px 12px;background:var(--a);color:#fff;font-size:11px;border-radius:20px;margin-bottom:10px;font-weight:600}
    .question{font-size:15px;font-weight:600;margin-bottom:14px;padding:12px;background:rgba(0,0,0,.03);border-radius:8px;line-height:1.6}
    
    .opts{display:flex;flex-direction:column;gap:10px}
    .opt{padding:14px 16px;background:var(--bg);border-radius:10px;cursor:pointer;box-shadow:3px 3px 6px var(--si),-3px -3px 6px var(--so);display:flex;align-items:center;gap:12px;transition:all .15s;border:2px solid transparent}
    .opt:hover{border-color:rgba(29,185,84,.3)}
    .opt.sel{border-color:var(--a);background:rgba(29,185,84,.05);box-shadow:inset 2px 2px 4px var(--si),inset -2px -2px 4px var(--so)}
    .opt-mark{width:26px;height:26px;border-radius:50%;background:var(--si);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
    .opt.sel .opt-mark{background:var(--a);color:#fff}
    .opt p{font-size:14px;flex:1}
    
    .nav{position:fixed;bottom:0;left:0;right:0;height:70px;background:var(--bg);display:flex;align-items:center;justify-content:center;gap:12px;padding:0 12px;box-shadow:0 -2px 8px rgba(0,0,0,.1);z-index:100}
    .nav-btn{padding:12px 24px;border-radius:8px;border:none;background:var(--bg);color:var(--t);font-size:14px;font-weight:600;cursor:pointer;box-shadow:3px 3px 6px var(--si),-3px -3px 6px var(--so)}
    .nav-btn:disabled{opacity:.4;cursor:not-allowed}
    .nav-btn.primary{background:var(--a);color:#fff}
    .nav-center{width:48px;height:48px;border-radius:50%;background:var(--a);color:#fff;border:none;font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(29,185,84,.3)}
    
    .pop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:20px}
    .pop.show{display:flex}
    .pop-box{background:var(--bg);border-radius:16px;padding:20px;width:100%;max-width:360px;max-height:80vh;overflow-y:auto}
    .pop-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .pop h3{font-size:16px}
    .pop-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
    .pop-grid button{aspect-ratio:1;border:none;border-radius:8px;background:var(--bg);color:var(--t);font-size:12px;font-weight:600;cursor:pointer;box-shadow:2px 2px 4px var(--si),-2px -2px 4px var(--so)}
    .pop-grid button.ans{background:var(--a);color:#fff}
    .pop-grid button.cur{border:2px solid var(--a)}
    
    .res{display:none;position:fixed;inset:0;background:var(--bg);z-index:300;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow-y:auto}
    .res.show{display:flex}
    .res-box{background:var(--bg);padding:32px;border-radius:24px;box-shadow:8px 8px 16px var(--si),-8px -8px 12px var(--so);max-width:400px;width:100%}
    .res-circle{width:140px;height:140px;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 24px;box-shadow:6px 6px 12px var(--si),-6px -6px 12px var(--so)}
    .res-score{font-size:36px;font-weight:800;color:var(--a)}
    .res-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#888;margin-top:4px}
    .res h2{font-size:24px;margin-bottom:8px}
    .res p{color:#888;margin-bottom:24px;font-size:15px;line-height:1.5}
    .res-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
    .res-btns button{min-width:120px}
    
    .det{display:none;position:fixed;inset:0;background:var(--bg);z-index:250;overflow-y:auto;padding:80px 16px 24px}
    .det-head{position:fixed;top:0;left:0;right:0;height:56px;background:var(--bg);display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 2px 8px rgba(0,0,0,.1);z-index:251}
    .det h3{flex:1;font-size:16px}
    .det-summary{background:var(--bg);padding:20px;border-radius:16px;margin-bottom:20px;box-shadow:4px 4px 8px var(--si),-4px -4px 8px var(--so);text-align:center}
    .det-summary .big{font-size:48px;font-weight:800;color:var(--a)}
    .det-item{margin-bottom:16px;padding:16px;background:rgba(0,0,0,.03);border-radius:12px;border-left:4px solid var(--d)}
    .det-item.ok{border-left-color:var(--a)}
    .det-item h4{font-size:13px;color:#888;margin-bottom:8px}
    .det-item .q-text{font-size:15px;font-weight:600;margin-bottom:10px;padding:10px;background:var(--bg);border-radius:8px}
    .det-item .ans-row{display:flex;gap:16px;margin-bottom:6px;font-size:14px}
    .det-item .ans-row strong{min-width:80px}
    .det-item .exp{font-size:13px;color:#666;margin-top:10px;padding:12px;background:var(--bg);border-radius:8px;box-shadow:inset 2px 2px 4px var(--si);line-height:1.6}
    
    .hide{display:none!important}
    @media(max-width:400px){
      .opt{padding:12px}
      .res-box{padding:24px}
      .res-circle{width:120px;height:120px}
      .res-score{font-size:32px}
      .pop-grid{grid-template-columns:repeat(5,1fr)}
    }
  </style>
</head>
<body>
  <div id="load"><div class="spinner"></div></div>

  <div id="quiz">
    <div class="top">
      <button class="btn" onclick="exit()">←</button>
      <h1>Exposure Switches</h1>
      <button class="btn" onclick="toggleTheme()">🌙</button>
    </div>
    
    <div class="prog"><div class="prog-bar" id="pbar"></div></div>
    <div class="prog-text" id="ptxt">0/0</div>
    
    <div class="q-cont">
      <div class="timer" id="timer">⏱️ 20:00</div>
      <div class="section-type" id="stype">Section A</div>
      <div class="question" id="question"></div>
      <div class="opts" id="opts"></div>
    </div>
    
    <div class="nav">
      <button class="nav-btn" id="prevBtn" onclick="prev()">← Prev</button>
      <button class="nav-center" onclick="showPop()">📋</button>
      <button class="nav-btn primary" id="nextBtn" onclick="next()">Next →</button>
    </div>
  </div>

  <div class="pop" id="pop" onclick="hidePop(event)">
    <div class="pop-box" onclick="event.stopPropagation()">
      <div class="pop-head">
        <h3>Question Navigator</h3>
        <button class="btn" onclick="hidePop()">✕</button>
      </div>
      <div class="pop-grid" id="pgrid"></div>
      <div style="font-size:12px;color:#888;text-align:center;margin-top:8px">
        <span style="color:var(--a)">●</span> Answered &nbsp;
        <span style="color:var(--t)">●</span> Current &nbsp;
        <span style="color:#666">●</span> Unanswered
      </div>
    </div>
  </div>

  <div class="res" id="res">
    <div class="res-box">
      <div class="res-circle">
        <div class="res-score" id="rscore">0%</div>
        <div class="res-label">Score</div>
      </div>
      <h2 id="rtitle">Quiz Complete!</h2>
      <p id="rmsg">You completed the quiz</p>
      <div class="res-btns">
        <button class="primary" onclick="showDet()">📊 View Details</button>
        <button class="nav-btn" onclick="continueQuiz()">↩ Continue</button>
        <button class="nav-btn" onclick="restart()" style="background:var(--d);color:#fff">🔄 Restart</button>
      </div>
    </div>
  </div>

  <div class="det" id="det">
    <div class="det-head">
      <button class="btn" onclick="hideDet()">← Back</button>
      <h3>Detailed Results</h3>
      <button class="btn" onclick="window.print()">🖨️ Print</button>
    </div>
    <div id="dcont"></div>
  </div>

<script>
const CONFIG = { TIME: 1200, PASS: 60 }; // 20 minutes

const SECTIONS = {
  0: "A: Exposure Control & Switching Basics",
  10: "B: Mechanical Contactors",
  18: "C: Electronically Controlled Mechanical Contactors",
  26: "D: Electronic Switches & Semiconductors",
  40: "E: P-N Junction & Diodes",
  46: "F: Transistors & Thyristors"
};

function getSection(qIndex) {
  const keys = Object.keys(SECTIONS).map(Number).sort((a, b) => b - a);
  for (let k of keys) {
    if (qIndex >= k) return SECTIONS[k];
  }
  return "Introduction";
}

const QUIZ_DATA = [
  // Section A: Exposure Control & Switching Basics (1-10)
  {q:"In X-ray imaging, exposure refers to the:",o:["Voltage supplied to the X-ray tube","Length of time the image receptor remains within the X-ray beam","Amount of filtration used","Distance between the patient and tube"],a:1,e:"Exposure is defined as the length of time the image receptor is exposed to the X-ray beam."},
  {q:"An overexposed X-ray film is described in the material as appearing:",o:["Uniformly white","Grey","Uniformly dark or burnt out","Completely transparent"],a:2,e:"Overexposure results in a film that is uniformly dark or burnt out because too much radiation reaches the receptor."},
  {q:"An underexposed X-ray film appears:",o:["Very light or whitened","Very dark","Burnt out","Black with no contrast"],a:0,e:"Underexposure produces a very light or whitened image due to insufficient radiation reaching the film."},
  {q:"Which of the following is NOT one of the three functions required for exposure control?",o:["Start the exposure","Monitor the exposure duration","End the exposure","Increase patient temperature"],a:3,e:"The three essential functions are start, monitor duration, and end the exposure. Increasing patient temperature is unrelated."},
  {q:"The component responsible for monitoring the duration of exposure is the:",o:["Switching system","Timing system","Transformer","Rectifier"],a:1,e:"The timing system monitors and controls how long the exposure lasts."},
  {q:"The switching system primarily functions to:",o:["Produce X-rays","Increase tube voltage","Start and stop the electrical circuit","Cool the X-ray tube"],a:2,e:"The switching system starts and stops the electrical circuit that powers the X-ray tube."},
  {q:"An X-ray switching system is similar in principle to a:",o:["Transformer","Wall switch","Rectifier","Capacitor"],a:1,e:"It works on the same basic principle as an ordinary wall switch – opening and closing a circuit."},
  {q:"A switching system may be located in the:",o:["Patient only","Low-voltage or high-voltage section","Filtration system only","Collimator only"],a:1,e:"Switching can occur in either the low-voltage or high-voltage section of the generator."},
  {q:"Which of the following is classified as an exposure switching device?",o:["Mechanical contactor","Generator housing","Image intensifier","Collimator"],a:0,e:"Mechanical contactors are a classic type of exposure switching device."},
  {q:"Which of the following types of switches is identified as obsolete in the material?",o:["Electronic switch","Mechanical contactor","Both mechanical contactors and electronically controlled mechanical contactors","Thyristor"],a:2,e:"Both pure mechanical contactors and electronically controlled mechanical contactors are considered obsolete in modern equipment."},

  // Section B: Mechanical Contactors (11-18)
  {q:"Mechanical contactors operate primarily through:",o:["Semiconductor action","Physical movement of contacts","Light energy","Magnetic resonance"],a:1,e:"They rely on the physical movement of metal contacts to open or close the circuit."},
  {q:"Mechanical contactors were commonly found in:",o:["Modern digital X-ray systems only","Very old X-ray equipment","MRI machines","Ultrasound equipment"],a:1,e:"They were typical of older X-ray generators and are rarely used today."},
  {q:"A mechanical contactor generally uses a:",o:["Spring-loaded mechanical contact","Silicon diode","Capacitor","Photodiode"],a:0,e:"Most mechanical contactors use spring-loaded contacts that open and close."},
  {q:"Before exposure, the mechanical contactor:",o:["Opens and remains open","Closes the circuit","Removes the X-ray beam","Reverses the current"],a:1,e:"The contactor closes the circuit so that current can flow when exposure is initiated."},
  {q:"One advantage of mechanical contactors is that they are:",o:["Very fast","Expensive","Cheap and uncomplicated","Completely electronic"],a:2,e:"They are simple, inexpensive and easy to understand."},
  {q:"Which is a disadvantage of mechanical contactors?",o:["No physical movement","Poor response time","No wear and tear","Perfectly suited for very short exposure times"],a:1,e:"Their relatively slow response time makes them unsuitable for very short exposures."},
  {q:"Sparking in mechanical contactors may occur because of:",o:["Contact-related electrical effects","Low patient temperature","Excess filtration","Image receptor movement"],a:0,e:"Sparking is caused by the electrical effects that occur when contacts open or close under load."},
  {q:"Mechanical contactors are unsuitable when:",o:["Very fast switching is required","The exposure is long","The machine is switched off","The image receptor is digital"],a:0,e:"They cannot switch fast enough for modern short-exposure techniques."},

  // Section C: Electronically Controlled Mechanical Contactors (19-26)
  {q:"Electronically controlled mechanical contactors differ from ordinary mechanical contactors because they include:",o:["An image intensifier","An electronic component such as a thyratron valve","A transformer only","A photomultiplier"],a:1,e:"They incorporate an electronic device (e.g. thyratron) to control the mechanical contacts more precisely."},
  {q:"The purpose of switching at zero current is primarily to reduce:",o:["Image size","Patient dose completely","Sparking and contact welding","Tube voltage"],a:2,e:"Switching at the zero-crossing point of the AC waveform minimises sparking and welding of the contacts."},
  {q:"Switching at the zero point of the AC waveform is called:",o:["Reverse bias","Forward bias","Phased switching","Doping"],a:2,e:"This technique is known as phased switching."},
  {q:"In an electronically controlled mechanical contactor, the contactor coils operate by producing:",o:["Heat","A magnetic field","Light","Radiation"],a:1,e:"Current in the coils generates a magnetic field that moves the contacts."},
  {q:"The magnetic field produced by the contactor coil causes the contactor to:",o:["Move","Cool","Emit X-rays","Rectify AC"],a:0,e:"The magnetic field attracts the armature, causing the contacts to move."},
  {q:"Before exposure in the electronically controlled mechanical contactor, the make contactor is:",o:["Closed","Open","Burnt","Removed"],a:1,e:"The make contactor starts open and closes when exposure begins."},
  {q:"Before exposure, the break contactor is:",o:["Open","Closed","Disconnected","Destroyed"],a:1,e:"The break contactor is closed before exposure and opens to terminate it."},
  {q:"When the selected exposure time expires, the break contactor:",o:["Closes to continue exposure","Pulls away to end exposure","Produces X-rays","Increases current"],a:1,e:"It opens (pulls away), interrupting the circuit and ending the exposure."},

  // Section D: Electronic Switches & Semiconductors (27-40)
  {q:"Electronic switches differ from mechanical switches because electronic switches:",o:["Require more moving parts","Do not require moving components","Always use springs","Cannot control current"],a:1,e:"They have no moving parts; switching is performed by semiconductor action."},
  {q:"Electronic switches rely primarily on the properties of:",o:["Semiconductors","Wood","Glass only","Water"],a:0,e:"Semiconductors (silicon, etc.) are the key materials used in electronic switches."},
  {q:"The three terminals of a thyratron are:",o:["Emitter, base and collector","Anode, cathode and grid","Gate, drain and source","Positive, negative and neutral"],a:1,e:"A thyratron has an anode, cathode and control grid."},
  {q:"In a thyratron, a negative bias on the grid:",o:["Encourages electron movement","Repels electrons and can stop current flow","Increases X-ray production directly","Removes the cathode"],a:1,e:"Negative grid bias repels electrons and prevents conduction until the bias is removed."},
  {q:"Primary electronic switching involves switching:",o:["Only mechanical contacts","Low voltage and sometimes very large currents","Only high-frequency sound","Only image receptors"],a:1,e:"Primary switching handles the low-voltage side, which can still involve large currents."},
  {q:"The thyristor specifically identified for primary electronic switching is the:",o:["Silicon Controlled Rectifier","Vacuum diode","Photodiode","Thermistor"],a:0,e:"The Silicon Controlled Rectifier (SCR) is the thyristor used for primary electronic switching."},
  {q:"SCR stands for:",o:["Silicon Current Resistor","Silicon Controlled Rectifier","Semiconductor Current Relay","Switching Control Resistor"],a:1,e:"SCR = Silicon Controlled Rectifier."},
  {q:"A rectifier allows current to:",o:["Flow equally in both directions","Flow in one direction","Stop permanently","Flow only through air"],a:1,e:"A rectifier permits current flow in only one direction."},
  {q:"When AC is passed through a basic rectifier, the rectifier:",o:["Allows both half-cycles equally","Allows one half-cycle and blocks the other","Converts AC into mechanical movement","Stops all current permanently"],a:1,e:"It passes one half-cycle and blocks the opposite half-cycle."},
  {q:"Which of the following is a semiconductor material mentioned in the material?",o:["Silicon","Copper","Aluminium","Iron"],a:0,e:"Silicon is the classic semiconductor material used in these devices."},
  {q:"The process of deliberately adding impurities to a semiconductor is called:",o:["Rectification","Doping","Biasing","Switching"],a:1,e:"Doping is the intentional addition of impurities to control semiconductor properties."},
  {q:"An n-type semiconductor contains an increased number of:",o:["Holes","Electrons","Neutrons","Protons"],a:1,e:"n-type material is rich in free electrons (negative charge carriers)."},
  {q:"A p-type semiconductor contains an increased number of:",o:["Electrons","Holes","Neutrons","Photons"],a:1,e:"p-type material has an excess of holes (positive charge carriers)."},
  {q:"Phosphorus is given as an example of a:",o:["Donor dopant","Acceptor dopant","Cathode","Gate"],a:0,e:"Phosphorus donates extra electrons and is therefore a donor (n-type) dopant."},

  // Section E: P-N Junction & Diodes (41-46)
  {q:"A p-n junction is formed by combining:",o:["Two n-type materials","Two p-type materials","P-type and n-type semiconductors","A transistor and transformer"],a:2,e:"A p-n junction is the boundary created by joining p-type and n-type semiconductor material."},
  {q:"The depletion layer is also known as the:",o:["Space charge zone","Collector region","Gate region","Emission zone"],a:0,e:"The depletion layer is also called the space-charge zone."},
  {q:"In forward bias, the p-region is connected to the:",o:["Negative terminal","Positive terminal","Ground only","Cathode only"],a:1,e:"Forward bias connects the p-side to the positive terminal of the supply."},
  {q:"In forward bias, a diode:",o:["Normally conducts","Completely blocks current","Explodes","Becomes a transformer"],a:0,e:"A forward-biased diode conducts current readily."},
  {q:"In reverse bias, the depletion layer:",o:["Becomes narrower","Collapses immediately","Becomes wider","Disappears"],a:2,e:"Reverse bias widens the depletion layer, increasing the barrier to current flow."},
  {q:"In normal reverse bias, the p-n junction:",o:["Conducts freely","Blocks electrical conduction","Produces X-rays","Amplifies current"],a:1,e:"Under reverse bias the junction blocks current (apart from a tiny leakage current)."},

  // Section F: Transistors & Thyristors (47-50)
  {q:"The three regions of a transistor are:",o:["Anode, cathode and gate","Emitter, base and collector","P, N and diode","Grid, plate and cathode"],a:1,e:"A bipolar transistor has three regions: emitter, base and collector."},
  {q:"Which of the following is a function of a transistor?",o:["Amplification","Cooling the X-ray tube","Producing ultrasound","Filtering the patient"],a:0,e:"One of the primary functions of a transistor is signal amplification."},
  {q:"How many main operating states does the material identify for a thyristor?",o:["Two","Three","Four","Five"],a:1,e:"A thyristor has three main operating states (off, on, and the transition)."},
  {q:"Which of the following is an advantage of electronic timers?",o:["They require many moving components","They have poor timing accuracy","They allow accurate timing of switching","They cannot perform phased switching"],a:2,e:"Electronic timers provide highly accurate control of exposure timing and can perform phased switching."}
];

let state = {
  data: QUIZ_DATA,
  ans: new Array(QUIZ_DATA.length).fill(null),
  q: 0,
  time: CONFIG.TIME,
  timer: null,
  submitted: false
};

function init() {
  const loadEl = document.getElementById('load');
  if (loadEl) loadEl.classList.add('hide');

  try {
    const saved = sessionStorage.getItem('exposure_switches_quiz_progress');
    if (saved) {
      const d = JSON.parse(saved);
      if (Date.now() - d.ts < 86400000 && !d.submitted) {
        state.q = d.q;
        state.ans = d.ans;
        state.time = d.time;
      }
    }
  } catch (e) {}

  document.getElementById('quiz').style.display = 'block';
  startTimer();
  render();
}

function startTimer() {
  if (state.timer) clearInterval(state.timer);
  state.timer = setInterval(() => {
    if (state.time > 0) {
      state.time--;
      updateTimer();
      if (state.time % 10 === 0) saveProgress();
    } else {
      submit(true);
    }
  }, 1000);
}

function updateTimer() {
  const m = Math.floor(state.time / 60);
  const s = state.time % 60;
  const el = document.getElementById('timer');
  el.textContent = `⏱️ \( {m}: \){s.toString().padStart(2, '0')}`;
  el.className = 'timer' + (state.time < 60 ? ' danger' : state.time < 300 ? ' warn' : '');
}

function render() {
  const q = state.data[state.q];
  const done = state.ans.filter(x => x !== null).length;
  document.getElementById('pbar').style.width = (done / state.data.length * 100) + '%';
  document.getElementById('ptxt').textContent = `\( {done}/ \){state.data.length}`;
  document.getElementById('stype').textContent = `Section ${getSection(state.q)} • Question ${state.q + 1}/50`;
  document.getElementById('question').textContent = q.q;

  const opts = document.getElementById('opts');
  opts.innerHTML = '';
  q.o.forEach((o, i) => {
    const d = document.createElement('div');
    d.className = 'opt' + (state.ans[state.q] === i ? ' sel' : '');
    d.innerHTML = `<div class="opt-mark">\( {String.fromCharCode(65 + i)}</div><p> \){o}</p>`;
    d.onclick = () => select(i);
    opts.appendChild(d);
  });

  document.getElementById('prevBtn').disabled = state.q === 0;
  document.getElementById('nextBtn').textContent = state.q === state.data.length - 1 ? 'Submit Quiz ✓' : 'Next →';
}

function select(i) {
  state.ans[state.q] = i;
  document.querySelectorAll('.opt').forEach((el, idx) => el.classList.toggle('sel', idx === i));
  saveProgress();
}

function next() {
  if (state.q === state.data.length - 1) {
    const unans = state.ans.filter(x => x === null).length;
    if (unans > 0 && !confirm(`${unans} question(s) unanswered. Submit anyway?`)) {
      showPop();
      return;
    }
    submit(false);
    return;
  }
  state.q++;
  render();
}

function prev() {
  if (state.q > 0) state.q--;
  render();
}

function saveProgress() {
  try {
    sessionStorage.setItem('exposure_switches_quiz_progress', JSON.stringify({
      q: state.q, ans: state.ans, time: state.time, submitted: state.submitted, ts: Date.now()
    }));
  } catch (e) {}
}

function submit(timeout) {
  clearInterval(state.timer);
  state.submitted = true;
  saveProgress();

  let correct = 0;
  state.data.forEach((q, i) => { if (state.ans[i] === q.a) correct++; });
  const pct = Math.round((correct / state.data.length) * 100);

  document.getElementById('quiz').style.display = 'none';
  document.getElementById('res').style.display = 'flex';
  document.getElementById('res').classList.add('show');
  document.getElementById('rscore').textContent = pct + '%';

  let title, msg;
  if (timeout) title = '⏰ Time Up!';
  else if (pct >= 80) title = '🎉 Outstanding!';
  else if (pct >= 60) title = '🌟 Well Done!';
  else if (pct >= 40) title = '👍 Good Effort!';
  else title = '💪 Keep Going!';

  if (pct >= 80) {
    msg = `You scored <strong>\( {correct}/ \){state.data.length}</strong> (${pct}%)<br><br>Excellent mastery of Exposure Switches and Switching Devices! You are very well prepared. Keep practising to stay sharp.`;
  } else if (pct >= 60) {
    msg = `You scored <strong>\( {correct}/ \){state.data.length}</strong> (${pct}%)<br><br>✓ Pass mark achieved! Solid understanding. Review the questions you missed (especially semiconductors and contactors) and you’ll be even stronger.`;
  } else if (pct >= 40) {
    msg = `You scored <strong>\( {correct}/ \){state.data.length}</strong> (${pct}%)<br><br>You’re making good progress. Focus on the explanations for mechanical vs electronic switching and p-n junctions. Consistent revision will raise your score quickly!`;
  } else {
    msg = `You scored <strong>\( {correct}/ \){state.data.length}</strong> (${pct}%)<br><br>Don’t worry — this topic has many technical details. Go through the detailed results carefully, revise the key concepts, and try again. Every attempt improves your understanding. You’ve got this!`;
  }

  document.getElementById('rtitle').textContent = title;
  document.getElementById('rmsg').innerHTML = msg;
}

function continueQuiz() {
  document.getElementById('res').classList.remove('show');
  document.getElementById('res').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
}

function showPop() {
  const g = document.getElementById('pgrid');
  g.innerHTML = '';
  state.data.forEach((_, i) => {
    const b = document.createElement('button');
    b.textContent = i + 1;
    if (state.ans[i] !== null) b.className = 'ans';
    if (i === state.q) b.style.border = '2px solid var(--a)';
    b.onclick = () => { state.q = i; hidePop(); render(); };
    g.appendChild(b);
  });
  document.getElementById('pop').classList.add('show');
}

function hidePop(e) {
  if (!e || e.target.id === 'pop') document.getElementById('pop').classList.remove('show');
}

function showDet() {
  const c = document.getElementById('dcont');
  c.innerHTML = '';

  let correct = 0;
  state.data.forEach((q, i) => { if (state.ans[i] === q.a) correct++; });
  const pct = Math.round((correct / state.data.length) * 100);

  const sum = document.createElement('div');
  sum.className = 'det-summary';
  sum.innerHTML = `<div class="big">\( {pct}%</div><div> \){correct}/${state.data.length} correct</div>`;
  c.appendChild(sum);

  const sections = [0, 10, 18, 26, 40, 46, 50];
  const sectionNames = [
    "A: Exposure Control & Switching Basics",
    "B: Mechanical Contactors",
    "C: Electronically Controlled Mechanical Contactors",
    "D: Electronic Switches & Semiconductors",
    "E: P-N Junction & Diodes",
    "F: Transistors & Thyristors"
  ];

  for (let s = 0; s < 6; s++) {
    const start = sections[s];
    const end = sections[s + 1];

    const ph = document.createElement('div');
    ph.style.cssText = 'margin:20px 0 12px;padding:12px;background:var(--a);color:#fff;border-radius:8px;font-size:14px';
    ph.innerHTML = `<strong>Section ${sectionNames[s]}</strong>`;
    c.appendChild(ph);

    for (let i = start; i < end; i++) {
      const q = state.data[i];
      const ans = state.ans[i];
      const ok = ans === q.a;
      const d = document.createElement('div');
      d.className = 'det-item' + (ok ? ' ok' : '');
      d.innerHTML = `
        <h4>Question ${i + 1}</h4>
        <div class="q-text">${q.q}</div>
        <div class="ans-row"><strong>Your answer:</strong> ${ans !== null ? String.fromCharCode(65 + ans) + ') ' + q.o[ans] : 'Not answered'}</div>
        <div class="ans-row"><strong>Correct:</strong> ${String.fromCharCode(65 + q.a) + ') ' + q.o[q.a]}</div>
        <div class="exp">${q.e}</div>
      `;
      c.appendChild(d);
    }
  }

  document.getElementById('res').classList.remove('show');
  document.getElementById('res').style.display = 'none';
  document.getElementById('det').style.display = 'block';
}

function hideDet() {
  document.getElementById('det').style.display = 'none';
  document.getElementById('res').style.display = 'flex';
  document.getElementById('res').classList.add('show');
}

function restart() {
  if (!confirm('Start a new quiz? All progress will be reset.')) return;
  sessionStorage.removeItem('exposure_switches_quiz_progress');
  location.reload();
}

function exit() {
  if (confirm('Exit quiz? Your progress is saved.')) {
    saveProgress();
    location.reload();
  }
}

function toggleTheme() {
  document.body.classList.toggle('light');
  localStorage.setItem('exposure_switches_quiz_theme', document.body.classList.contains('light') ? 'light' : 'dark');
}

document.addEventListener('DOMContentLoaded', () => {
  if (localStorage.getItem('exposure_switches_quiz_theme') === 'light') {
    document.body.classList.add('light');
  }
  init();
});
</script>
</body>
</html>
